{% extends 'base.html' %}

{% block title %}Проверьте почту — Silhouette{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-body p-4 p-md-5 text-center">
        <div class="display-5 mb-3" aria-hidden="true">✉</div>
        <h1 class="h3 mb-3">Проверьте электронную почту</h1>
        <p class="text-secondary">Аккаунт создан. Чтобы войти, подтвердите адрес по ссылке в письме. Если письма нет, проверьте папку «Спам».</p>
        <a href="{% url 'login' %}" class="btn btn-dark mt-2">Перейти ко входу</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
