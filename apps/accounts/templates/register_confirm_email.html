<div style="max-width: 600px; margin: 0 auto; font-family: Arial, sans-serif;">
  <div style="background-color: #222; color: #fff; padding: 30px; border-radius: 12px;">
    <h1 style="text-align: center;">Подтверждение аккаунта Silhouette</h1>
    <p style="text-align: center; font-size: 16px;">Привет, {{ user.username }}. Подтвердите адрес электронной почты, чтобы начать пользоваться Silhouette.</p>
    <div style="text-align: center; margin: 28px 0;">
      <a href="{{ protocol }}://{{ domain }}{% url 'account_activate' uidb64=uid token=token %}" style="background-color: #fff; color: #222; padding: 14px 24px; border-radius: 8px; text-decoration: none; display: inline-block; font-size: 16px;">Подтвердить адрес</a>
    </div>
    <p style="text-align: center; color: #ccc; font-size: 12px;">Если вы не создавали аккаунт, просто проигнорируйте это письмо.</p>
  </div>
</div>
